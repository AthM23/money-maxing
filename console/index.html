<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footnote console</title>
<style>
  :root {
    --paper: #f6f3ea; --card: #fffdf7; --ink: #1d1b16; --muted: #6f695b; --rule: #d9d2bf;
    --tick: #b3261e; --ok: #1f6f43; --warn: #9a6200; --accent: #1f3f8f; --hover: #efe9d8; --hl: #fbe6b8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #16150f; --card: #1e1c15; --ink: #ece7d8; --muted: #9a9382; --rule: #38342a; --tick: #ff8a80; --ok: #7ed3a2; --warn: #f0b95b; --accent: #9db7ff; --hover: #28251c; --hl: #4d3d14; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { padding: 18px 24px 14px; border-bottom: 1px solid var(--rule); display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 28px; }
  h1 { font: 600 22px/1 Georgia, "Times New Roman", serif; margin: 0; letter-spacing: .2px; }
  h1 sup { color: var(--tick); font-size: 13px; }
  h2 { font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 10px; }
  h3 { font: 600 15px/1.2 Georgia, "Times New Roman", serif; margin: 22px 0 8px; padding-top: 14px; border-top: 1px solid var(--rule); }
  h3 small { font: 400 12px ui-sans-serif, system-ui, sans-serif; color: var(--muted); margin-left: 8px; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .tied { color: var(--ok); } .untied { color: var(--tick); font-weight: 600; }
  main { display: grid; gap: 18px; padding: 18px 24px; }
  .row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
  .row2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .row3, .row2 { grid-template-columns: minmax(0, 1fr); } main { padding: 16px; } }
  section { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; min-width: 0; }
  .board { max-height: 520px; overflow: auto; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .neg { color: var(--tick); } .pos { color: var(--ink); } .good { color: var(--ok); }

  .intent { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 8px; border-top: 1px solid var(--rule); cursor: pointer; border-radius: 4px; }
  .intent:first-of-type { border-top: 0; } .intent:hover, .intent.sel { background: var(--hover); }
  .intent .q { font-weight: 500; } .intent .meta { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
  .pill { font: 600 11px/1 ui-monospace, Consolas, monospace; padding: 3px 6px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; align-self: start; display: inline-block; }
  .resolved, .done, .mirrored, .approved { color: var(--ok); } .open, .in_progress, .dry_run, .corrected { color: var(--warn); }
  .waiting_on_human { color: var(--accent); } .abandoned, .todo, .skipped { color: var(--muted); } .blocked, .failed, .rejected { color: var(--tick); }
  .tag { font: 600 10px/1 ui-monospace, Consolas, monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--rule); border-radius: 3px; padding: 2px 4px; margin-right: 6px; }
  a.jump { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--ink); padding: 3px 6px; }
  td { padding: 3px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  td.n, th.n { text-align: right; font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
  tr.total td { border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); font-weight: 600; }
  td.chg { background: var(--hl); } td.lbl { color: var(--muted); font-size: 12px; white-space: nowrap; }
  table.tight td, table.tight th { padding: 3px 5px; font-size: 12px; }

  .kv { color: var(--muted); font-size: 12px; } .kv b { color: var(--ink); font-weight: 500; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 8px; margin: 6px 0; font: 12px/1.4 ui-monospace, Consolas, monospace; max-height: 220px; overflow: auto; }
  .feed { max-height: 320px; overflow: auto; font: 12px/1.5 ui-monospace, Consolas, monospace; }
  .feed div { border-bottom: 1px solid var(--rule); padding: 2px 0; overflow-wrap: anywhere; } .feed .t { color: var(--accent); } .feed .ts { color: var(--muted); }
  .empty { color: var(--muted); padding: 8px 0; }
  .scroll { overflow-x: auto; }
  details > summary { cursor: pointer; color: var(--muted); font-size: 12px; }

  /* close checklist */
  .check { display: grid; grid-template-columns: 20px 1fr auto; gap: 0 8px; padding: 6px 2px; border-top: 1px solid var(--rule); }
  .check:first-of-type { border-top: 0; }
  .check .g { font: 600 14px/1.4 ui-monospace, Consolas, monospace; text-align: center; }
  .check .why { grid-column: 2 / -1; color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .lock { margin: 0 0 8px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 4px; font-size: 13px; }

  /* forecast */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
  .tile { border: 1px solid var(--rule); border-radius: 4px; padding: 6px 8px; min-width: 0; }
  .tile .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .tile .v { font: 600 16px/1.3 ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .bar { position: relative; height: 12px; min-width: 70px; background: linear-gradient(var(--rule), var(--rule)) center / 1px 100% no-repeat; }
  .bar i { position: absolute; top: 2px; bottom: 2px; border-radius: 1px; }
  .bar i.p { left: 50%; background: var(--ok); } .bar i.m { right: 50%; background: var(--tick); }

  /* ripple lanes */
  .thesis { font: italic 15px/1.3 Georgia, "Times New Roman", serif; color: var(--muted); margin: 2px 0 10px; }
  .lanes { border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
  .lane { display: grid; grid-template-columns: 132px minmax(0, 1fr); border-top: 1px solid var(--rule); }
  .lane:first-child { border-top: 0; }
  .lane > .name { padding: 12px 12px; background: var(--paper); border-right: 1px solid var(--rule); font: 600 13px/1.2 ui-sans-serif, system-ui, sans-serif; text-transform: uppercase; letter-spacing: .07em; }
  .lane > .name small { display: block; font-weight: 400; color: var(--muted); letter-spacing: 0; text-transform: none; margin-top: 3px; }
  .lane > .body { padding: 4px 14px; min-width: 0; }
  .rip { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 0 16px; padding: 8px 0; border-top: 1px dashed var(--rule); align-items: baseline; }
  .rip:first-child { border-top: 0; }
  .rip .amt { text-align: right; font: 600 21px/1.15 ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rip .amt small { display: block; font: 400 11px/1.3 ui-sans-serif, system-ui, sans-serif; color: var(--muted); white-space: normal; }
  .rip .what { min-width: 0; overflow-wrap: anywhere; }
  .rip .what .sub { font: 13px ui-monospace, Consolas, monospace; margin-top: 2px; }
  .lane.none > .body { color: var(--muted); padding: 12px 14px; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .two { grid-template-columns: minmax(0, 1fr); } .rip { grid-template-columns: 150px minmax(0, 1fr); } }

  /* workpaper */
  .decision { border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; margin-top: 12px; }
  .ticks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 10px 0; }
  @media (max-width: 1000px) { .ticks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tickbox { border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px; min-width: 0; }
  .tickbox.fail { border-color: var(--tick); } .tickbox.judgment { border-style: dashed; border-color: var(--warn); }
  .tickbox .head { display: flex; align-items: baseline; gap: 8px; }
  .tickbox .letter { font: 700 26px/1 Georgia, "Times New Roman", serif; color: var(--tick); }
  .tickbox .cls { font-weight: 600; }
  .tickbox .tally { font: 12px ui-monospace, Consolas, monospace; margin: 4px 0; }
  .tickbox ul { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; }
  .tickbox li { padding: 3px 0; border-top: 1px solid var(--rule); overflow-wrap: anywhere; }
  .tickbox li b { font-family: ui-monospace, Consolas, monospace; }
  .evidence { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 8px; margin-top: 10px; }
  .evidence .letter { font: 700 26px/1 Georgia, "Times New Roman", serif; color: var(--tick); }
  .source { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px; margin: 6px 0 0; font: 13px/1.5 Georgia, "Times New Roman", serif; max-height: 260px; overflow: auto; }
  mark { background: var(--hl); color: inherit; padding: 1px 0; border-bottom: 2px solid var(--tick); }
  .approval { margin: 8px 0; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Footnote<sup>†</sup></h1>
  <div class="stats" id="stats">loading…</div>
</header>
<main>
  <div class="row3">
    <section><h2>Drift board · intents</h2><div class="board" id="intents"></div></section>
    <section><h2 id="close-title">Close checklist</h2><div class="board" id="close"></div></section>
    <section><h2 id="forecast-title">13-week cash forecast</h2><div class="board" id="forecast"></div></section>
  </div>
  <section id="intent-section"><h2>Intent · ripple and workpaper</h2><div id="detail"><div class="empty">Select an intent on the drift board.</div></div></section>
  <div class="row2">
    <section><h2>Event bus</h2><div class="feed" id="events"></div></section>
    <section><h2>Trial balance</h2><div class="scroll" id="tb"></div></section>
  </div>
</main>
<script>
"use strict";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const int = (v) => (Number.isFinite(Number(v)) ? Math.trunc(Number(v)) : 0);
// display only: cents stay integers until the last step, which splits the digit string rather than dividing
const digits = (c) => { const s = String(Math.abs(int(c))).padStart(3, "0"); return Number(s.slice(0, -2)).toLocaleString("en-US") + "." + s.slice(-2); };
const usd = (c) => (int(c) < 0 ? "(" + digits(c) + ")" : digits(c)); // trial balance, accounting style
const money = (c) => (int(c) < 0 ? "−$" : "$") + digits(c);
const signed = (c) => (int(c) > 0 ? "+$" + digits(c) : money(c));
const tone = (c) => (int(c) < 0 ? "neg" : "pos");
const when = (ts) => esc(String(ts ?? "").replace("T", " ").slice(0, 19));
const plural = (n, word) => `${int(n)} ${word}${int(n) === 1 ? "" : "s"}`;

let selected = null;
const painted = new Map();
/** Re-render a node only when its markup changed, so polling never collapses an opened detail or resets a scroll. */
function put(id, html) {
  if (painted.get(id) === html) return;
  painted.set(id, html);
  document.getElementById(id).innerHTML = html;
}

// ───────────── main page

function renderStats(m) {
  const tied = m.ar_gl_cents === m.ar_subledger_cents;
  put("stats",
    `<span>traces <b>${(m.traces || []).map((t) => `${esc(t.source)} ${int(t.n)}`).join(" · ") || 0}</b></span>` +
    `<span>bank lines <b>${int(m.bank_lines)}</b>, unmatched <b>${int(m.bank_unmatched)}</b></span>` +
    `<span>intents open <b>${int(m.intents_open)}</b>, resolved <b>${int(m.intents_resolved)}</b></span>` +
    `<span>routes <b>${(m.routes || []).map((r) => `${esc(r.route)} ${int(r.n)}`).join(" · ") || "none"}</b></span>` +
    `<span>model calls <b>${int(m.model_calls)}</b></span>` +
    `<span class="${tied ? "tied" : "untied"}">AR GL ${money(m.ar_gl_cents)} ${tied ? "=" : "≠"} subledger ${money(m.ar_subledger_cents)}</span>`);
}

/** "PROPOSE+PROPOSE+AUTO" → "PROPOSE ×2 · AUTO": an intent with twelve decisions must not fill its row with routes. */
function routeCounts(routes) {
  if (!routes) return "no route yet";
  const n = new Map();
  for (const r of String(routes).split("+")) n.set(r, (n.get(r) || 0) + 1);
  return [...n].map(([r, k]) => (k > 1 ? `${r} ×${k}` : r)).join(" · ");
}

function intentMeta(i) {
  const c = i.case_file || {}, bits = [];
  if (i.comparator) bits.push(esc(i.comparator));
  if (c.party_id) bits.push(esc(c.party_id));
  if (c.bank_txn_id) bits.push(esc(c.bank_txn_id));
  if (c.expected_cents != null) bits.push(`received ${money(c.received_cents || 0)} of ${money(c.expected_cents)}`);
  else if (i.drift_delta_cents != null) bits.push(`difference ${money(i.drift_delta_cents)}`);
  bits.push(esc(routeCounts(i.routes)));
  if (i.tier != null) bits.push("tier " + int(i.tier));
  if (int(i.decisions) > 1) bits.push(plural(i.decisions, "decision"));
  if (int(i.ripples)) bits.push(`<b>${plural(i.ripples, "ripple")}</b>`);
  return bits.join(" · ");
}

function renderIntents(intents) {
  put("intents", intents.length ? intents.map((i) =>
    `<div class="intent ${i.id === selected ? "sel" : ""}" data-id="${esc(i.id)}"><span class="q"><span class="tag">${esc(i.function)}</span>${esc(i.question)}</span>` +
    `<span class="pill ${esc(i.status)}">${esc(i.status)}</span><span class="meta">${intentMeta(i)}</span></div>`).join("")
    : '<div class="empty">No intents yet. Run <code>pnpm spine</code>.</div>');
}

const GLYPH = { done: "✓", in_progress: "…", blocked: "✕", todo: "○" };

function renderClose(b) {
  const cl = b.checklist, p = b.period;
  put("close-title", `Close checklist${p ? " · " + esc(p.id) : ""}${b.world_date ? ` <span style="text-transform:none;letter-spacing:0;font-weight:400">· world date ${esc(b.world_date)}</span>` : ""}`);
  if (!cl || !cl.items.length) return put("close", `<div class="empty">No checklist${p ? " for " + esc(p.id) : ": no open period"} yet. The close conductor seeds it on its first pass.</div>`);
  const n = cl.counts, total = cl.items.length;
  put("close",
    `<div class="lock"><b>${int(n.done)} of ${total}</b> done · ${int(n.in_progress)} in progress · ${int(n.blocked)} blocked · ${int(n.todo)} to do<br>` +
    `<span class="${cl.ready_to_lock ? "good" : "kv"}">${cl.ready_to_lock ? "Ready to lock: every machine step is done. Locking is a person's call." : "Not ready to lock"}</span></div>` +
    cl.items.map((i) => `<div class="check"><span class="g ${esc(i.status)}">${GLYPH[i.status] || "·"}</span><span>${esc(i.name)} <span class="kv">${esc(i.function)}</span></span>` +
      `<span class="pill ${esc(i.status)}">${esc(i.status)}</span>${i.blocked_reason ? `<span class="why" title="${esc(i.blocked_reason)}">${esc(i.blocked_reason)}</span>` : ""}</div>`).join(""));
}

function netBar(net, max) {
  const w = max > 0 ? Math.round((Math.abs(int(net)) * 50) / max) : 0;
  return `<div class="bar"><i class="${int(net) < 0 ? "m" : "p"}" style="width:${w}%"></i></div>`;
}

function renderForecast(f) {
  const v = f && f.latest;
  put("forecast-title", `13-week cash forecast${v ? ` · v${int(v.version)} as of ${esc(v.as_of_date)}` : ""}`);
  if (!v) return put("forecast", '<div class="empty">No forecast version yet. The forecast engine builds the baseline on its first pass.</div>');
  const max = Math.max(0, ...v.weeks.map((w) => Math.abs(int(w.net_cents))));
  const tile = (l, val, extra) => `<div class="tile"><div class="l">${l}</div><div class="v">${val}</div>${extra ? `<div class="kv">${extra}</div>` : ""}</div>`;
  put("forecast",
    `<div class="tiles">${tile("Opening cash", money(v.opening_cash_cents))}${tile("Minimum cash", money(v.min_cash_cents), "week of " + esc(v.min_cash_week))}` +
    `${tile("Inflow, 13 weeks", money(v.inflow_cents))}${tile("Outflow, 13 weeks", money(v.outflow_cents), "not modelled: " + esc((v.not_modelled || []).join(", ") || "none"))}</div>` +
    `<table class="tight"><tr><th>Week of</th><th class=n>Net</th><th></th><th class=n>Closing cash</th></tr>` +
    v.weeks.map((w) => `<tr><td>${esc(w.week)}${w.week === v.min_cash_week ? ' <span class="kv">min</span>' : ""}</td><td class="n ${tone(w.net_cents)}">${signed(w.net_cents)}</td><td>${netBar(w.net_cents, max)}</td><td class=n>${money(w.closing_cents)}</td></tr>`).join("") +
    `</table><h2 style="margin-top:14px">Versions</h2>` +
    f.versions.map((x) => `<div class="kv" style="padding:3px 0"><b>v${int(x.version)}</b> ${esc(x.as_of_date)} · ${esc(x.reason)} · inflow <b>${money(x.inflow_cents)}</b> · min <b>${money(x.min_cash_cents)}</b>` +
      `${x.cause_intent_id ? ` · <a class="jump" data-id="${esc(x.cause_intent_id)}">caused by ${esc(x.cause_intent_id)}</a>` : ""}</div>`).join(""));
}

function renderTrialBalance(tb) {
  let dr = 0, cr = 0;
  put("tb", "<table><tr><th>Account</th><th></th><th class=n>Debit</th><th class=n>Credit</th></tr>" + tb.map((r) => {
    const d = r.balance_cents > 0 ? r.balance_cents : 0, c = r.balance_cents < 0 ? -r.balance_cents : 0; dr += d; cr += c;
    return `<tr><td>${esc(r.account)}</td><td>${esc(r.name)}</td><td class=n>${d ? usd(d) : ""}</td><td class=n>${c ? usd(c) : ""}</td></tr>`;
  }).join("") + `<tr class=total><td></td><td>${dr === cr ? "Footed" : "DOES NOT FOOT"}</td><td class=n>${usd(dr)}</td><td class=n>${usd(cr)}</td></tr></table>`);
}

async function refresh() {
  const s = await (await fetch("/api/state")).json();
  renderStats(s.summary);
  renderIntents(s.intents || []);
  renderClose(s.boards || {});
  renderForecast((s.boards || {}).forecast);
  put("events", (s.events || []).map((e) => `<div><span class="ts">#${int(e.id)} ${esc(String(e.ts).slice(11, 19))}</span> <span class="t">${esc(e.topic)}</span> ${esc(e.from_function)} ${esc(JSON.stringify(e.payload).slice(0, 220))}</div>`).join("") || '<div class="empty">Bus is empty.</div>');
  renderTrialBalance(s.trial_balance || []);
  if (selected) await showIntent(selected, false);
}

// ───────────── intent: ripple lanes (sheet 30)

const LANES = [["ar", "AR"], ["revenue", "Revenue"], ["forecast", "Forecast"], ["close", "Close"], ["drift", "Drift"], ["qbo", "QuickBooks"]];
const laneOf = (r) => (String(r.kind).startsWith("qbo_") || r.function === "quickbooks" ? "qbo" : r.function);

/** The prominent figure for one ripple row, its unit, and a second line that carries the before and after. */
function rippleFigure(r, d) {
  const fromTo = r.before_cents != null && r.after_cents != null ? `${money(r.before_cents)} → ${money(r.after_cents)}` : "";
  if (r.kind === "checklist_tick") return { big: "✓", cls: "good", unit: "ticked", sub: "" };
  if (r.kind === "forecast_version") {
    const f = (d.forecasts || []).find((x) => x.as_of === r.ref), bh = f && f.beyond_horizon;
    if (bh && bh.monthly_delta_cents != null) return { big: signed(bh.monthly_delta_cents), cls: tone(bh.monthly_delta_cents), unit: `a month through ${esc(bh.through)}`, sub: `${signed(r.delta_cents)} in the 13-week horizon${fromTo ? ` (${fromTo})` : ""}` };
    return { big: signed(r.delta_cents), cls: tone(r.delta_cents), unit: "in the 13-week horizon", sub: fromTo };
  }
  if (r.kind === "rev_schedule_revision") {
    const m = (d.modifications || []).find((x) => x.after && x.after.schedule_id === r.ref);
    const total = m && m.before ? ` · contract ${money(m.before.total_cents)} → ${money(m.after.total_cents)}` : "";
    return { big: signed(r.delta_cents), cls: tone(r.delta_cents), unit: "a month", sub: (fromTo ? fromTo + " a month" : "") + total };
  }
  if (r.function === "drift") {
    const m = (d.modifications || []).find((x) => x.contract_id === r.ref), step = m && (m.lines.find((l) => l.delta_cents) || {}).delta_cents;
    const times = step && int(r.delta_cents) % step === 0 ? ` · ${int(r.delta_cents) / step} × ${signed(step)}` : "";
    return { big: signed(r.delta_cents), cls: tone(r.delta_cents), unit: "CRM deal vs schedule", sub: fromTo + times };
  }
  if (r.delta_cents == null) return { big: "·", cls: "", unit: "", sub: fromTo };
  return { big: signed(r.delta_cents), cls: tone(r.delta_cents), unit: r.kind === "rev_recognition" ? "this month's revenue" : "", sub: fromTo };
}

function rippleRow(r, d) {
  const f = rippleFigure(r, d);
  return `<div class="rip"><div class="amt ${f.cls}">${f.big}${f.unit ? `<small>${f.unit}</small>` : ""}</div><div class="what">${esc(r.summary)}` +
    `${f.sub ? `<div class="sub">${f.sub}</div>` : ""}<div class="kv">${esc(r.kind)} · ${esc(r.ref)}${r.event_id != null ? " · event #" + int(r.event_id) : ""}</div></div></div>`;
}

const plainRow = (big, cls, html) => `<div class="rip"><div class="amt ${cls}" style="font-size:15px">${big}</div><div class="what">${html}</div></div>`;

function closeExtras(d, ripple) {
  const ticked = new Set(ripple.filter((r) => r.kind === "checklist_tick").map((r) => r.ref));
  return (d.checklist || []).filter((c) => !ticked.has(c.id)).map((c) =>
    plainRow(GLYPH[c.status] || "·", esc(c.status), `${esc(c.name)} <span class="pill ${esc(c.status)}">${esc(c.status)}</span><div class="kv">cites this intent's decision · ${esc(c.id)}</div>`));
}

function driftExtras(d) {
  return (d.drift || []).map((c) => {
    const link = c.intent ? `<a class="jump" data-id="${esc(c.intent.id)}">${esc(c.intent.question)}</a> <span class="pill ${esc(c.intent.status)}">${esc(c.intent.status)}</span>` : "";
    if (c.relation === "self") return plainRow(money(c.delta_cents), "", `Opened by comparator <b>${esc(c.comparator)}</b>: a difference of ${money(c.delta_cents)}<div class="kv">${esc(c.dedupe_key)} · first seen ${when(c.first_seen)}</div>`);
    if (c.relation === "cause") return plainRow("←", "", `Caused by ${link}`);
    return plainRow(money(c.delta_cents), "", `${esc(c.comparator)} case: ${link}<div class="kv">${esc(c.dedupe_key)} · last seen ${when(c.last_seen)}</div>`);
  });
}

function mirrorExtras(d) {
  return (d.mirror || []).map((m) => m.status === "mirrored"
    ? plainRow("✓", "good", `${esc(m.kind)} mirrored to ${esc(m.system)} as <b>${esc(m.external_id)}</b><div class="kv">${esc(m.decision_id)} · ${when(m.mirrored_at)}</div>`)
    : plainRow("–", "", `${esc(m.kind)} not mirrored <span class="pill ${esc(m.status)}">${esc(m.status)}</span>: ${esc(m.detail || "no detail recorded")}<div class="kv">${esc(m.decision_id)} · ${when(m.mirrored_at)}</div>`));
}

const NOTHING = {
  ar: "Nothing booked in AR for this intent.", revenue: "No revenue schedule touched.", forecast: "No forecast version caused by this intent.",
  close: "No checklist item moved by this intent.", drift: "No drift case linked.", qbo: "Not mirrored: the mirror has not seen a posted decision of this intent.",
};

function renderLanes(d) {
  const ripple = d.ripple || [], known = new Set(LANES.map((l) => l[0]));
  const extra = [...new Set(ripple.map(laneOf))].filter((k) => !known.has(k)).map((k) => [k, k]);
  const lanes = [...LANES, ...extra].map(([key, label]) => {
    const rowsHtml = ripple.filter((r) => laneOf(r) === key).map((r) => rippleRow(r, d));
    if (key === "close") rowsHtml.push(...closeExtras(d, ripple));
    if (key === "drift") rowsHtml.push(...driftExtras(d));
    if (key === "qbo") rowsHtml.push(...mirrorExtras(d));
    const changes = ripple.filter((r) => laneOf(r) === key).length, mirrored = (d.mirror || []).filter((m) => m.status === "mirrored").length;
    const note = key === "qbo" && !changes ? (mirrored ? plural(mirrored, "object") + " mirrored" : "not mirrored") : changes ? plural(changes, "change") : rowsHtml.length ? "no change · " + plural(rowsHtml.length, "link") : "no change";
    return `<div class="lane ${rowsHtml.length ? "" : "none"}"><div class="name">${esc(label)}<small>${note}</small></div>` +
      `<div class="body">${rowsHtml.join("") || esc(NOTHING[key] || "Nothing recorded.")}</div></div>`;
  });
  return `<div class="thesis">The same transaction means the same thing everywhere.</div><div class="lanes">${lanes.join("")}</div>`;
}

// ───────────── intent: schedule before / after, forecast delta

function renderSchedule(m) {
  const head = `<div class="kv"><b>${esc(m.contract_id)}</b> · ${esc(m.treatment)}${m.pct_off_bps != null ? ` · ${int(m.pct_off_bps) / 100}% off` : ""} · from ${esc(m.effective_period)}${m.until ? " until " + esc(m.until) : ""}` +
    ` · memo ${money(m.memo_cents)} on account ${esc(m.memo_account)} · cause ${esc(m.cause_decision_id)}${m.fact_id ? " · fact " + esc(m.fact_id) : ""}</div>`;
  if (!m.lines.length) return head + `<div class="empty">Schedule left alone (${esc(m.treatment)}): change in schedule total ${signed(m.delta_total_cents)}.</div>`;
  const cell = (l, v) => `<td class="n ${l.delta_cents ? "chg" : ""}">${v == null ? "" : digits(v)}</td>`;
  const row = (label, pick, total) => `<tr><td class="lbl">${label}</td>${m.lines.map((l) => cell(l, pick(l))).join("")}<td class="n"><b>${total}</b></td></tr>`;
  return head + `<div class="scroll"><table class="tight"><tr><th>$</th>${m.lines.map((l) => `<th class=n>${esc(l.period)}</th>`).join("")}<th class=n>Contract total</th></tr>` +
    row(`before · v${int(m.from_version)}`, (l) => l.before_cents, m.before ? digits(m.before.total_cents) : "") +
    row(`after · v${int(m.to_version)}`, (l) => l.after_cents, m.after ? digits(m.after.total_cents) : "") +
    `<tr><td class="lbl">change</td>${m.lines.map((l) => `<td class="n ${l.delta_cents ? "chg " + tone(l.delta_cents) : ""}">${l.delta_cents ? signed(l.delta_cents).replace("$", "") : ""}</td>`).join("")}<td class="n ${tone(m.delta_total_cents)}"><b>${signed(m.delta_total_cents)}</b></td></tr>` +
    `<tr><td class="lbl">recognised</td>${m.lines.map((l) => `<td class="n kv">${l.recognised === "none" ? "" : esc(l.recognised)}</td>`).join("")}<td></td></tr></table></div>`;
}

function renderForecastDelta(f) {
  const head = `<div class="kv"><b>${esc(f.as_of)}</b>${f.prior_as_of ? " against " + esc(f.prior_as_of) : ""} · ${esc(f.reason)} · min cash ${money(f.min_cash_cents)} in week of ${esc(f.min_cash_week)}` +
    `${f.beyond_horizon ? ` · beyond the horizon: ${signed(f.beyond_horizon.monthly_delta_cents)} a month through ${esc(f.beyond_horizon.through)}` : ""}</div>`;
  const x = f.diff;
  if (!x) return head + '<div class="empty">No earlier version to compare with.</div>';
  const weeks = `<table class="tight"><tr><th>Inflow, week of</th><th class=n>Before</th><th class=n>After</th><th class=n>Change</th></tr>` +
    x.inflow_by_week.map((w) => `<tr><td>${esc(w.week)}</td><td class="n ${w.delta_cents ? "chg" : ""}">${digits(w.before_cents)}</td><td class="n ${w.delta_cents ? "chg" : ""}">${digits(w.after_cents)}</td><td class="n ${w.delta_cents ? "chg " + tone(w.delta_cents) : ""}">${w.delta_cents ? signed(w.delta_cents) : ""}</td></tr>`).join("") +
    `<tr class=total><td>13 weeks</td><td></td><td></td><td class="n ${tone(x.delta_inflow_cents)}">${signed(x.delta_inflow_cents)}</td></tr></table>`;
  const sources = `<table class="tight"><tr><th>Line that moved</th><th>Week</th><th class=n>Before</th><th class=n>After</th><th class=n>Change</th></tr>` +
    x.by_source_ref.map((s) => `<tr><td>${esc(s.source_ref)}<div class="kv">${esc(s.kind)}</div></td><td>${esc(s.week_after || s.week_before || "")}${s.week_after ? "" : '<div class="kv">dropped out</div>'}</td>` +
      `<td class=n>${digits(s.before_cents)}</td><td class=n>${digits(s.after_cents)}</td><td class="n ${tone(s.delta_cents)}">${signed(s.delta_cents)}</td></tr>`).join("") +
    `<tr class=total><td>Closing cash, end of horizon</td><td></td><td></td><td></td><td class="n ${tone(x.delta_closing_cents)}">${signed(x.delta_closing_cents)}</td></tr></table>` +
    `<div class="kv" style="margin-top:6px">Outflows changed by ${signed(x.delta_outflow_cents)}.</div>`;
  return head + `<div class="two" style="margin-top:6px"><div class="scroll">${weeks}</div><div class="scroll">${sources}</div></div>`;
}

// ───────────── intent: workpaper with four tick marks

const CLASSES = [["F", "footed"], ["E", "agreed to source"], ["P", "approved by"], ["J", "per policy"]];
const SYMBOL = { pass: "✓", fail: "✗", judgment: "~" };
const notApplicable = (k) => /^n\/a\b/.test(String(k.detail || ""));

function tickBox(letter, name, marks) {
  const n = { pass: 0, fail: 0, judgment: 0 };
  for (const k of marks) if (k.status in n) n[k.status]++;
  const na = marks.filter(notApplicable).length, worst = n.fail ? "fail" : n.judgment ? "judgment" : "";
  return `<div class="tickbox ${worst}"><div class="head"><span class="letter">${letter}</span><span class="cls">${name}</span></div>` +
    `<div class="tally"><span class="${n.pass ? "good" : ""}">${n.pass} pass</span> · <span class="${n.fail ? "neg" : ""}">${n.fail} fail</span> · ${n.judgment} judgment${na ? ` <span class="kv">(${na} n/a)</span>` : ""}</div>` +
    (marks.length ? `<details ${worst ? "open" : ""}><summary>${plural(marks.length, "check")}</summary><ul>${marks.map((k) =>
      `<li><b class="${k.status === "pass" ? "good" : k.status === "fail" ? "neg" : ""}">${esc(k.check)} ${SYMBOL[k.status] || "?"}</b> ${esc(k.detail)}${(k.refs || []).length ? `<div class="kv">${esc(k.refs.join(", "))}</div>` : ""}</li>`).join("")}</ul></details>`
      : '<div class="kv">no checks recorded</div>') + "</div>";
}

/** Every string inside a trace payload, body-like fields first, so the quote can be shown where it was written. */
function payloadStrings(payload) {
  const out = [];
  (function walk(v, key) {
    if (typeof v === "string") out.push([key, v]);
    else if (v && typeof v === "object") for (const [k, inner] of Object.entries(v)) walk(inner, k);
  })(payload, "");
  const rank = (k) => (["body", "text", "content", "note", "notes"].includes(k) ? 0 : 1);
  return out.sort((a, b) => rank(a[0]) - rank(b[0]) || b[1].length - a[1].length);
}

/** [start, end) of the quote in the text: exact first, then tolerant of whitespace differences. */
function findQuote(text, quote) {
  const at = text.indexOf(quote);
  if (at >= 0) return [at, at + quote.length];
  const tokens = quote.trim().split(/\s+/).filter(Boolean).map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!tokens.length) return null;
  const hit = new RegExp(tokens.join("\\s+")).exec(text);
  return hit ? [hit.index, hit.index + hit[0].length] : null;
}

function quotedSource(trace, quote) {
  if (!trace) return '<div class="kv neg">source trace not loaded</div>';
  const strings = payloadStrings(trace.payload);
  for (const [key, text] of quote ? strings : []) {
    const span = findQuote(text, quote);
    if (!span) continue;
    const from = Math.max(0, span[0] - 600), to = Math.min(text.length, span[1] + 600);
    return `<div class="kv">${esc(trace.source)}/${esc(trace.kind)} · field <b>${esc(key)}</b> · happened ${when(trace.event_time)}${trace.payload && trace.payload.from ? " · from " + esc(trace.payload.from) : ""}${trace.payload && trace.payload.subject ? " · “" + esc(trace.payload.subject) + "”" : ""}</div>` +
      `<div class="source">${from ? "…" : ""}${esc(text.slice(from, span[0]))}<mark>${esc(text.slice(span[0], span[1]))}</mark>${esc(text.slice(span[1], to))}${to < text.length ? "…" : ""}</div>`;
  }
  const fallback = strings[0] ? strings[0][1] : JSON.stringify(trace.payload);
  return `<div class="kv ${quote ? "neg" : ""}">${quote ? "quote not found verbatim in this source" : "cited without a quote"}</div><div class="source">${esc(String(fallback).slice(0, 1200))}</div>`;
}

function renderEvidence(p, traces) {
  const list = (p && p.evidence) || [];
  return list.map((v) => `<div class="evidence"><span class="letter">E</span><div><div><b>${esc(v.claim)}</b> <span class="kv">${esc(v.trace_id)}</span></div>` +
    `${v.quote ? `<div class="kv">quoted: “${esc(v.quote)}”</div>` : ""}${quotedSource(traces.find((t) => t.id === v.trace_id), v.quote)}</div></div>`).join("");
}

function renderApprovals(x) {
  if (!(x.approvals || []).length) return `<div class="approval kv"><b class="mono">P</b> no approval on record${x.route === "AUTO" ? " (route AUTO: none required)" : ""}</div>`;
  return x.approvals.map((a) => `<div class="approval"><b class="mono neg">P</b> <span class="pill ${esc(a.outcome)}">${esc(a.outcome)}</span> by <b>${esc(a.approver_name || a.approver_id)}</b>` +
    `<span class="kv"> ${esc(a.approver_id)}${a.approver_role ? " · " + esc(a.approver_role) : ""} · ${esc(a.approver_kind)} · ${when(a.approved_at)}${a.note ? " · “" + esc(a.note) + "”" : ""}</span></div>`).join("");
}

function renderDecision(x, traces, open) {
  const wp = x.workpaper, e = x.entry, marks = (wp && wp.marks) || [];
  const amount = e ? e.lines.reduce((n, l) => n + int(l.debit_cents), 0) : null;
  const body =
    `<div class="kv">actor <b>${esc(x.actor)}</b> · tier <b>${esc(x.tier ?? "-")}</b> · model calls <b>${int(x.model_calls)}</b> · cost <b>$${(int(x.cost_micros) / 1e6).toFixed(4)}</b> · ${esc(x.id)}</div>` +
    (wp ? `<div class="kv" style="margin-top:6px">Workpaper <b>${esc(wp.id)}</b> · stage <b>${esc(wp.stage || "?")}</b>${(wp.stages || []).length > 1 ? ` (latest of ${esc(wp.stages.join(" → "))})` : ""} · kernel <b class="${wp.kernel_verdict === "accept" ? "good" : "neg"}">${esc(wp.kernel_verdict)}</b> · re-performed ${int(wp.checkable_num)}/${int(wp.checkable_den)} · ${when(wp.created_at)}</div>` +
      `<div class="ticks">${CLASSES.map(([c, name]) => tickBox(c, name, marks.filter((k) => k.cls === c))).join("")}</div>` : '<div class="empty">No workpaper yet.</div>') +
    renderApprovals(x) +
    (e ? `<div class="scroll"><table><tr><th>${esc(e.id)} · ${esc(e.date)} · ${esc(e.memo)}</th><th class=n>Debit</th><th class=n>Credit</th></tr>${e.lines.map((l) => `<tr><td>${esc(l.account)} ${esc(l.party_id || "")}</td><td class=n>${l.debit_cents ? usd(l.debit_cents) : ""}</td><td class=n>${l.credit_cents ? usd(l.credit_cents) : ""}</td></tr>`).join("")}</table></div>` : "") +
    renderEvidence(x.proposal, traces);
  return `<details class="decision" ${open ? "open" : ""}><summary style="font-size:14px;color:var(--ink)"><b>${esc(x.kind)}</b>${amount != null ? " " + money(amount) : ""} ` +
    `<span class="pill ${x.posted_at ? "resolved" : "open"}">${esc(x.route || "no route")}${x.posted_at ? " · posted" : ""}</span> ` +
    `<span class="kv">${CLASSES.map(([c]) => { const ms = marks.filter((k) => k.cls === c), bad = ms.some((k) => k.status === "fail"); return `<b class="${bad ? "neg" : ""}">${c}</b>${bad ? "✗" : ms.length ? "✓" : "·"}`; }).join(" ")}</span></summary>${body}</details>`;
}

async function showIntent(id, scroll) {
  selected = id;
  const r = await fetch("/api/intent?id=" + encodeURIComponent(id));
  if (!r.ok) return put("detail", `<div class="empty">No intent ${esc(id)} in this database.</div>`);
  const d = await r.json(), c = d.intent.case_file || {};
  const caseLine = c.party_id || c.bank_txn_id
    ? `party <b>${esc(c.party_id)}</b> · bank line <b>${esc(c.bank_txn_id || "-")}</b> · documents <b>${esc((c.doc_ids || []).join(", ") || "-")}</b> · expected <b>${money(c.expected_cents || 0)}</b> · received <b>${money(c.received_cents || 0)}</b> · shortfall <b>${money(c.shortfall_cents || 0)}</b>`
    : `function <b>${esc(d.intent.function)}</b> · owner <b>${esc(d.intent.owner)}</b>`;
  const decisions = d.decisions.map((x, n) => renderDecision(x, d.traces, d.decisions.length <= 3 || n === 0)).join("") || `<div class="empty">${d.intent.status === "resolved" ? "Closed without a decision: nothing had to be booked." : "No decision yet: waiting for an agent."}</div>`;
  put("detail",
    `<div style="font-size:17px"><span class="tag">${esc(d.intent.function)}</span><b>${esc(d.intent.question)}</b> <span class="pill ${esc(d.intent.status)}">${esc(d.intent.status)}</span></div>` +
    `<div class="kv" style="margin:4px 0 12px">${caseLine} · ${esc(d.intent.id)} · opened ${when(d.intent.created_at)}${d.intent.closed_at ? " · closed " + when(d.intent.closed_at) : ""}</div>` +
    renderLanes(d) +
    (d.modifications.length ? `<h3>Revenue schedule, before and after<small>monthly amounts in dollars; changed months highlighted</small></h3>${d.modifications.map(renderSchedule).join("")}` : "") +
    (d.forecasts.length ? `<h3>13-week forecast, weekly change<small>inflows per week, this version against the one it replaced</small></h3>${d.forecasts.map(renderForecastDelta).join("")}` : "") +
    `<h3>Decisions and workpapers<small>F footed · E agreed to source · P approved by · J per policy</small></h3>${decisions}` +
    `<h3>Evidence<small>three clocks: happened, recorded, ingested</small></h3>${d.traces.map((t) => `<details><summary><b>${esc(t.id)}</b> v${int(t.version)} · ${esc(t.source)}/${esc(t.kind)} · happened ${when(t.event_time)} · recorded ${when(t.recorded_time)} · ingested ${when(t.ingested_at)}</summary><pre>${esc(JSON.stringify(t.payload, null, 1))}</pre></details>`).join("") || '<div class="empty">none</div>'}` +
    `<h3>Events and artifacts</h3><div class="feed">${d.events.map((e) => `<div><span class="ts">#${int(e.id)}</span> <span class="t">${esc(e.topic)}</span> ${esc(e.from_function)}</div>`).join("")}${d.artifacts.map((a) => `<div>artifact <span class="t">${esc(a.system)}/${esc(a.kind)}</span> ${esc(a.external_id)} (${esc(a.function)})</div>`).join("")}</div>`);
  document.querySelectorAll(".intent").forEach((n) => n.classList.toggle("sel", n.dataset.id === id));
  if (scroll) document.getElementById("intent-section").scrollIntoView({ behavior: "smooth", block: "start" });
}

// ───────────── navigation: a click, a link inside the page, or #intent=<id> (so the demo can open one directly)

const hashIntent = () => { const m = /^#intent=(.+)$/.exec(location.hash); return m ? decodeURIComponent(m[1]) : null; };
function openIntent(id, scroll) {
  if (hashIntent() !== id) history.replaceState(null, "", "#intent=" + encodeURIComponent(id));
  return showIntent(id, scroll).catch(() => {});
}
document.addEventListener("click", (ev) => {
  const n = ev.target.closest("[data-id]");
  if (n) { ev.preventDefault(); openIntent(n.dataset.id, true); }
});
window.addEventListener("hashchange", () => { const id = hashIntent(); if (id && id !== selected) showIntent(id, true).catch(() => {}); });

selected = hashIntent();
refresh().catch(() => {}); setInterval(() => refresh().catch(() => {}), 2000);
</script>
